<div id="focus">
  {% if focus.rows %}
  <p class="hint num focus-count">{{ focus.open }} open{% if focus.done_count %}, {{ focus.done_count }} done{% endif %}</p>
  <ul class="focus-items">
    {% for f in focus.rows %}
    <li class="focus-item{% if f.done %} is-done{% endif %}" data-focus-id="{{ f.id }}">
      <form method="post" action="/focus/{{ f.id }}/status" hx-post="/focus/{{ f.id }}/status" hx-target="#focus" hx-swap="outerHTML" hx-disabled-elt="find button">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="status" value="{{ 'active' if f.done else 'done' }}">
        <button type="submit" class="focus-btn" role="checkbox" aria-checked="{{ 'true' if f.done else 'false' }}">
          <span class="box" aria-hidden="true">{% if f.done %}<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>{% endif %}</span>
          <span class="focus-body">
            <span class="focus-text">{{ f.text }}</span>
            {% if f.failing %}<span class="pill pill-warning">Keeps coming back</span>{% endif %}
            {% if f.done and f.done_on %}<span class="focus-meta">Done {{ f.done_on }}</span>{% endif %}
          </span>
        </button>
      </form>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <div class="empty"><p class="empty-text">No focus areas yet. They appear after your first weekly reflection.</p></div>
  {% endif %}
</div>
