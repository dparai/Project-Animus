{% extends "base.html" %}
{% block title %}Log in · Animus{% endblock %}
{% block head %}
  <style>
    .login { height: 100vh; /* taste-skill-ignore: fallback for browsers without dvh */ height: 100dvh; overflow-y: auto; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
    .login-form { width: 100%; max-width: 360px; display: flex; flex-direction: column; }
    .login-name { margin: 0; font-family: var(--font-serif); font-weight: 400; font-size: 48px; line-height: 52px; letter-spacing: -0.02em; }
    .login-lede { margin: 8px 0 32px; color: var(--muted); font-size: 15px; line-height: 22px; }
    .login-label { display: block; margin-bottom: 8px; font-weight: 500; }
    .pw-row { position: relative; }
    .login-field { display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 76px 0 18px; border: 0; border-radius: 16px; background: var(--raised); color: var(--text); font: inherit; font-size: 16px; }
    .login-field:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .login-field[aria-invalid="true"] { outline: 2px solid var(--negative); outline-offset: 2px; }
    .pw-toggle { position: absolute; top: 4px; right: 4px; min-width: 64px; min-height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font: inherit; cursor: pointer; transition: color 160ms ease; }
    .pw-toggle:hover { color: var(--text); }
    .login-msg { margin-top: 12px; align-self: flex-start; }
    .login-submit { margin-top: 24px; width: 100%; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    @media (prefers-reduced-motion: reduce) { .pw-toggle { transition: none; } }
  </style>
{% endblock %}
{% block body %}
  <main class="login">
    <form class="login-form" method="post" action="/login">
      <h1 class="login-name">Animus</h1>
      <p class="login-lede">Your journal is locked. Enter your password to open it.</p>
      <input type="hidden" name="next" value="{{ next }}">
      <input class="visually-hidden" type="text" name="username" value="owner" autocomplete="username" tabindex="-1" aria-hidden="true">
      <label class="login-label" for="password">Password</label>
      <div class="pw-row">
        <input class="login-field" id="password" name="password" type="password" autocomplete="current-password"
               maxlength="200" required autofocus{% if message %} aria-invalid="true" aria-describedby="login-msg"{% endif %}>
        <button class="pw-toggle" type="button" id="pw-toggle" aria-controls="password" aria-pressed="false">Show</button>
      </div>
      {% if message %}<p class="msg msg-error login-msg" id="login-msg" role="alert">{{ message }}</p>{% endif %}
      <button class="btn-main login-submit" type="submit">Log in</button>
    </form>
  </main>
  <script nonce="{{ csp_nonce }}">
    (function () {
      var field = document.getElementById('password');
      var toggle = document.getElementById('pw-toggle');
      toggle.addEventListener('click', function () {
        var show = field.type === 'password';
        field.type = show ? 'text' : 'password';
        toggle.textContent = show ? 'Hide' : 'Show';
        toggle.setAttribute('aria-pressed', show ? 'true' : 'false');
        field.focus();
      });
    })();
  </script>
{% endblock %}
